# ============================================================
# 图书馆智能管理系统 — 公共配置
# 环境相关配置请使用 application-{profile}.yml 覆盖
# ============================================================

spring:
  application:
    name: library-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---- 数据源 ----
  # 注：characterEncoding 合法值为 utf8（JDBC 驱动内部已映射为 MySQL 的 utf8mb4 四字节字符集），
  #     不存在 "utf8mb4" 这一编码名，写 utf8mb4 会被驱动忽略回退。
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123456}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # ---- Elasticsearch ----
  # 已生效：library-core 的 ElasticsearchConfig 手动声明 ElasticsearchClient Bean 并读取此配置键。
  #        ES Java 客户端 8.11（elasticsearch-java）已引入，索引在启动时由 EsIndexInitializer 幂等创建。
  elasticsearch:
    uris: ${ES_HOST:localhost}:${ES_PORT:9200}

  # ---- Neo4j ----
  # 生效前置：依赖由 library-knowledge-graph 提供的 spring-boot-starter-data-neo4j（已引入）。
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j123456}

  # ---- RabbitMQ ----
  # 生效前置：需引入 spring-boot-starter-amqp（当前各模块尚未引入，待异步事件/ES 同步等
  #          消息消费功能开发时在对应模块补全依赖后启用）。在此之前事件总线以 Spring
  #          Application Events（同步/异步 @EventListener）替代，不影响现有功能。
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # ---- Flyway 数据库迁移 ----
  # baseline-on-migrate: 针对已有库（非空）首次接入 Flyway 时自动建立基线，避免报错。
  # baseline-version: 设为 0，确保 V1__init_schema.sql 等所有 V1+ 迁移脚本都会被执行；
  #                   若设为 1，则 V1 会被当作基线跳过（首个迁移脚本将不执行）。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

# ---- MyBatis-Plus ----
# 全局逻辑删除：V1__init_schema.sql 已为全部业务表统一建立 deleted 列（TINYINT NOT NULL DEFAULT 0），
# 故全局启用 logic-delete-field，所有实体自动软删除，无需逐个加 @TableLogic。
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.library.core.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
    # 枚举映射：显式声明 type-handler，无 @EnumValue 时按枚举 name() 与 DB ENUM 列互转
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

# ---- JWT 认证 ----
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 7200000      # 2 小时
  refresh-token-expiration: 604800000   # 7 天

# ---- 限流（Redis 令牌桶，键定义见 RateLimitProperties）----
# login/register 按客户端 IP 防爆破；authenticated 按 userId；anonymous 按 IP
ratelimit:
  login:         { capacity: 20, refill-per-min: 20 }
  register:      { capacity: 20, refill-per-min: 20 }
  authenticated: { capacity: 100, refill-per-min: 100 }
  anonymous:     { capacity: 100, refill-per-min: 100 }

# ---- SpringDoc OpenAPI ----
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

# ---- 服务端口 ----
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

# ---- 日志 ----
logging:
  level:
    root: INFO
    com.library: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO

# ---- AI 基础设施 ----
# DeepSeek LLM：对话生成 / JSON Mode 结构化输出
# 阿里云百炼 Embedding：文本向量化（1024 维）
# HanLP NLP：本地中文分词 / 关键词提取（始终可用，无需外部 API Key）
ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: deepseek-chat
    connect-timeout: 10s
    read-timeout: 60s
    max-retries: 2
    max-tokens: 2048
    temperature: 0.7
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
    base-url: https://dashscope.aliyuncs.com
    connect-timeout: 10s
    read-timeout: 30s
    max-batch-size: 25

# ---- Actuator 健康检查 ----
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
