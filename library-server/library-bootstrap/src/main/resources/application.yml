# ============================================================
# 图书馆智能管理系统 — 公共配置
# 环境相关配置请使用 application-{profile}.yml 覆盖
# ============================================================

spring:
  application:
    name: library-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 禁用 Spring Boot 3.5 的 Docker Compose 自动管理：docker-compose.yml 在项目根目录，
  # 而 spring-boot:run 在 library-bootstrap 子模块运行会找不到 compose 文件导致启动失败。
  # 中间件由开发者手动 `docker-compose up -d`（项目根目录）启动，与应用解耦。
  docker:
    compose:
      enabled: false

  # ---- 数据源 ----
  # 注：characterEncoding 合法值为 utf8（JDBC 驱动内部已映射为 MySQL 的 utf8mb4 四字节字符集），
  #     不存在 "utf8mb4" 这一编码名，写 utf8mb4 会被驱动忽略回退。
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123456}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # ---- Elasticsearch ----
  # 已生效：library-core 的 ElasticsearchConfig 手动声明 ElasticsearchClient Bean 并读取此配置键。
  #        ES Java 客户端 8.11（elasticsearch-java）已引入，索引在启动时由 EsIndexInitializer 幂等创建。
  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}

  # ---- Neo4j ----
  # 生效前置：依赖由 library-knowledge-graph 提供的 spring-boot-starter-data-neo4j（已引入）。
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j123456}

  # ---- RabbitMQ 事件总线 ----
  # 阶段10 已引入 spring-boot-starter-amqp，事件总线正式启用（替代 Spring Application Events）。
  # 架构：领域事件 → EventBusBridge（@TransactionalEventListener AFTER_COMMIT 桥接）
  #      → library.events Topic Exchange → 业务队列 → @RabbitListener 消费。
  # 可靠性：消息持久化 + 消费端 3 次指数退避重试 + 死信队列（耗尽进 q.library.events.dlq）。
  # Exchange/Queue/Binding 声明见 RabbitMqConfig；常量见 EventBusConstants。
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # auto 模式：方法正常返回即 ack；抛异常由 retry interceptor 重试
        acknowledge-mode: auto
        # 消费失败重试：3 次指数退避（1s/2s/4s），耗尽后 reject 不 requeue，进入死信队列
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 4000
        default-requeue-rejected: false

  # ---- Flyway 数据库迁移 ----
  # baseline-on-migrate: 针对已有库（非空）首次接入 Flyway 时自动建立基线，避免报错。
  # baseline-version: 设为 0，确保 V1__init_schema.sql 等所有 V1+ 迁移脚本都会被执行；
  #                   若设为 1，则 V1 会被当作基线跳过（首个迁移脚本将不执行）。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

# ---- MyBatis-Plus ----
# 全局逻辑删除：V1__init_schema.sql 已为全部业务表统一建立 deleted 列（TINYINT NOT NULL DEFAULT 0），
# 故全局启用 logic-delete-field，所有实体自动软删除，无需逐个加 @TableLogic。
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.library.core.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
    # 枚举映射：MyBatis 标准 EnumTypeHandler 按枚举 name() 与 DB ENUM 列互转，
    # 与项目所有业务枚举（RoleEnum/BorrowStatusEnum/ReservationStatusEnum/UserStatusEnum 等）
    # 注释意图一致——枚举名直接对应 DB ENUM 值，不需要 @EnumValue 字段映射。
    # 注：MyBatis-Plus 默认 MybatisEnumTypeHandler 会强制要求 @EnumValue 否则启动报
    # 'Could not find @EnumValue in Class'，与本项目设计意图不符。
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

# ---- JWT 认证 ----
jwt:
  # ⚠️ 开发环境默认密钥仅用于本地调试——严禁用于生产！
  # 生产环境必须通过 JWT_SECRET 环境变量注入强随机密钥（≥256-bit）
  secret: ${JWT_SECRET:library-system-dev-jwt-secret-replace-in-production-2026}
  access-token-expiration: 7200000      # 2 小时
  refresh-token-expiration: 604800000   # 7 天

# ---- 限流（Redis 令牌桶，键定义见 RateLimitProperties）----
# login/register 按客户端 IP 防爆破；authenticated 按 userId；anonymous 按 IP
ratelimit:
  login:         { capacity: 20, refill-per-min: 20 }
  register:      { capacity: 20, refill-per-min: 20 }
  authenticated: { capacity: 100, refill-per-min: 100 }
  anonymous:     { capacity: 100, refill-per-min: 100 }

# ---- SpringDoc OpenAPI ----
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

# ---- 服务端口 ----
server:
  port: ${SERVER_PORT:8080}
  # 信任反向代理设置的 X-Forwarded-* 头（由 Tomcat RemoteIpValve 规范化进 remoteAddr），
  # 配合 RateLimitFilter 使用 getRemoteAddr() 防止 X-Forwarded-For 伪造绕过限流防爆破
  forward-headers-strategy: native
  servlet:
    context-path: /api/v1

# ---- 日志 ----
logging:
  level:
    root: INFO
    com.library: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO

# ---- AI 基础设施 ----
# DeepSeek LLM：对话生成 / JSON Mode 结构化输出
# 阿里云百炼 Embedding：文本向量化（1024 维）
# HanLP NLP：本地中文分词 / 关键词提取（始终可用，无需外部 API Key）
ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: deepseek-chat
    connect-timeout: 10s
    read-timeout: 60s
    write-timeout: 30s
    max-retries: 2
    max-tokens: 2048
    temperature: 0.7
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
    connect-timeout: 10s
    read-timeout: 30s
    write-timeout: 20s
    # DashScope text-embedding-v3 单次最多 10 条文本（API 强制限制），超出抛 InvalidParameter
    # 之前配 25 实测 batch size > 10 时单批失败降级零向量，影响 Content-based 推荐质量
    max-batch-size: 10

# ---- 推荐引擎 ----
recommendation:
  cf-weight: 0.4            # 协同过滤权重
  content-weight: 0.3       # 内容推荐权重
  kg-weight: 0.3            # 知识图谱权重（KG 就绪后生效）
  user-cf-top-k: 20         # User-CF 相似用户 Top-K
  item-cf-top-k: 10         # Item-CF 每本书取相似书 Top-K
  content-candidate-limit: 500  # 内容推荐候选池上限（控制 Embedding API 调用量）
  recall-timeout-seconds: 5 # 并行召回超时秒数
  max-limit: 50             # 推荐结果上限

# ---- 知识图谱 ----
# 生效前置：library-knowledge-graph 模块 + Neo4j 服务就绪
kg:
  default-query-depth: 2
  max-query-depth: 3
  tracing-max-depth: 5
  tracing-limit: 200
  topic-jaccard-threshold: 0.15
  core-book-top-n: 50
  pagerank-damping: 0.85
  pagerank-iterations: 20
  build-timeout-ms: 30000
  gds-enabled: true
  constraints-auto-create: true

# ---- 智能采编 ----
# 生效前置：library-acquisition 模块就绪
acquisition:
  prediction-min-months: 6
  prediction-history-months: 12
  duplicate-title-threshold: 0.8
  duplicate-author-title-threshold: 0.7
  gap-core-book-top-n: 50
  gap-heat-threshold: 0.7
  gap-coverage-threshold: 0.8
  negotiation-history-months: 24
  season-exam-factor: 1.3
  season-vacation-factor: 0.6
  prediction-confidence-decay: 0.05         # ARIMA 置信度按月衰减
  prediction-data-scarcity-penalty: 0.2     # 数据不足时置信度惩罚
  prediction-reservation-heat-coefficient: 0.01  # 预约热度影响系数
  prediction-base-multiplier: 1.1           # 预测调整基础乘数
  prediction-copies-divisor: 50             # 周转率→建议复本除数

# ---- Actuator 健康检查 ----
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
