# =============================================================================
# 图书馆智能管理系统 — 开发环境配置
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai

  # 开发环境可禁用某些中间件依赖
  flyway:
    enabled: true

logging:
  level:
    com.library: DEBUG
    org.springframework.web: DEBUG
    org.mybatis: DEBUG

# SpringDoc 开发环境始终启用
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
