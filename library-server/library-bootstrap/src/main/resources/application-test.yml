# =============================================================================
# 图书馆智能管理系统 — 测试环境配置
# 用于 CI 流水线与本地集成测试。数据源指向独立的测试库 library_db_test，
# 避免污染开发数据；test-data 目录存放各模块的可重复测试种子数据。
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_db_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123456}

  flyway:
    enabled: true
    # 先执行结构迁移，再执行测试种子数据（classpath:db/test-data 尚未创建，
    # 各业务模块编写集成测试时按需补充该目录下的 SQL/Java 数据初始化脚本）。
    locations: classpath:db/migration,classpath:db/test-data

logging:
  level:
    com.library: DEBUG

# 测试环境允许查看健康检查完整细节，便于排查中间件连通性
management:
  endpoint:
    health:
      show-details: always
