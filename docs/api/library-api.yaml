openapi: 3.0.3
info:
  title: 图书馆智能管理系统 API
  description: |
    ## 概述
    本 API 文档是图书馆智能管理系统前后端协作的**数据契约**，覆盖基础图书管理、学科知识图谱、智能采编三大功能域。

    ### 设计原则
    - **RESTful 风格**：资源导向 URL，HTTP 方法语义化
    - **统一响应体**：所有接口返回 `Result<T>` 结构
    - **分页规范**：GET 列表接口默认 page=1, size=20, maxSize=100
    - **错误码体系**：业务错误码 4 位数字，详见各接口说明

    ### 认证方式
    - 除 `/api/v1/auth/**` 外，所有接口需在 Header 中携带：`Authorization: Bearer <access_token>`
    - Access Token 有效期 2h，过期后使用 Refresh Token 换取新 Token

    ### 版本管理
    - URL 路径版本：`/api/v1/`
    - 破坏性变更时递增版本号，旧版本保持至少 6 个月的兼容期

    ### 接口限流
    - 所有需认证接口使用 Redis 令牌桶限流，默认 100 次/分钟/用户
    - 响应 Header 包含限流信息：`X-RateLimit-Limit`（总量）、`X-RateLimit-Remaining`（剩余）、`X-RateLimit-Reset`（重置时间戳）
    - 超出限流返回 HTTP 429，响应体含 `Retry-After` Header

    ### 联系人
    - 开发团队：LibrarySystem-SIT Team
  version: 1.0.0
  contact:
    name: 开发团队
    email: dev@library-system.local

servers:
  - url: http://localhost:8080
    description: 本地开发环境
  - url: https://dev-api.library-system.local
    description: 开发联调环境
  - url: https://api.library-system.local
    description: 生产环境

tags:
  - name: 认证
    description: 登录、注册、Token 刷新
  - name: 图书检索
    description: 多维度搜索、详情、推荐
  - name: 分类管理
    description: 图书分类树查询
  - name: 借阅管理
    description: 借书、还书、续借、借阅记录
  - name: 预约管理
    description: 预约、排队、取消、通知
  - name: 个人中心
    description: 个人信息、借阅历史、推荐
  - name: 知识图谱
    description: 主题网络、文献溯源、知识搜索
  - name: 智能采编
    description: 采购预测、查重、缺口分析、谈判
  - name: 系统管理
    description: 用户管理、图书编目（需管理员权限）

# ============================================================
#  全局组件定义
# ============================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Token，登录接口获取。
        Header 格式：`Authorization: Bearer eyJhbGciOi...`

  schemas:
    # ---- 统一响应体 ----
    Result:
      type: object
      properties:
        code:
          type: integer
          description: 状态码，200 表示成功
          example: 200
        message:
          type: string
          description: 提示信息
          example: 操作成功
        data:
          type: object
          description: 响应数据（泛型）
        timestamp:
          type: integer
          format: int64
          description: 响应时间戳（毫秒）
          example: 1718400000000

    PageResult:
      type: object
      properties:
        records:
          type: array
          description: 当前页数据列表
        total:
          type: integer
          format: int64
          description: 总记录数
          example: 150
        pageNum:
          type: integer
          description: 当前页码（从 1 开始）
          example: 1
        pageSize:
          type: integer
          description: 每页记录数
          example: 20
        totalPages:
          type: integer
          description: 总页数
          example: 8

    # ---- 分页参数 ----
    PageRequest:
      type: object
      properties:
        pageNum:
          type: integer
          default: 1
          minimum: 1
        pageSize:
          type: integer
          default: 20
          minimum: 1
          maximum: 100

    # ---- 认证 ----
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 用户名 / 学号
          example: "2024001001"
        password:
          type: string
          format: password
          description: 登录密码
          example: "Abc@123456"
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT 访问令牌（2h 有效）
        refreshToken:
          type: string
          description: 刷新令牌（7d 有效）
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          description: Access Token 有效期（秒）
          example: 7200
        user:
          $ref: "#/components/schemas/UserProfile"

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: 刷新令牌
    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    # ---- 用户 ----
    RegisterRequest:
      type: object
      required: [username, password, realName, email]
      properties:
        username:
          type: string
          description: 学号/工号
          minLength: 5
          maxLength: 20
          example: "2024001001"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 32
          description: 密码（8-32位，含大小写字母+数字+特殊字符）
          example: "Abc@123456"
        realName:
          type: string
          description: 真实姓名
          maxLength: 50
          example: "张三"
        email:
          type: string
          format: email
          example: "zhangsan@university.edu.cn"
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
          example: "13800138000"
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: "2024001001"
        realName:
          type: string
          example: "张三"
        role:
          type: string
          enum: [STUDENT, TEACHER, LIBRARIAN, ACQUISITOR, ADMIN]
          example: "STUDENT"
        email:
          type: string
          example: "zhangsan@university.edu.cn"
        phone:
          type: string
          example: "13800138000"
        maxBooks:
          type: integer
          example: 5
        status:
          type: string
          enum: [ACTIVE, FROZEN, DISABLED]
        createTime:
          type: string
          format: date-time

    # ---- 图书 ----
    BookSimpleVO:
      type: object
      description: 图书摘要信息（用于列表、嵌套引用等轻量场景）
      properties:
        id:
          type: integer
          format: int64
        isbn:
          type: string
          example: "978-7-111-58680-7"
        title:
          type: string
          example: "深入理解Java虚拟机"
        author:
          type: string
          example: "周志明"
        publisher:
          type: string
          example: "机械工业出版社"
        pubDate:
          type: string
          format: date
          example: "2019-12-01"
        categoryName:
          type: string
          example: "计算机科学"
        coverUrl:
          type: string
          format: uri
        availCopies:
          type: integer
          example: 3
    BookVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        isbn:
          type: string
          example: "978-7-111-58680-7"
        title:
          type: string
          example: "深入理解Java虚拟机"
        author:
          type: string
          example: "周志明"
        publisher:
          type: string
          example: "机械工业出版社"
        pubDate:
          type: string
          format: date
          example: "2019-12-01"
        categoryName:
          type: string
          example: "计算机科学"
        description:
          type: string
        coverUrl:
          type: string
          format: uri
        location:
          type: string
          example: "A区-3架-12层"
        availCopies:
          type: integer
          description: 可借册数
          example: 3
        totalCopies:
          type: integer
          description: 总册数
          example: 5
        borrowCount:
          type: integer
          description: 累计借阅次数
          example: 127
    BookDetailVO:
      allOf:
        - $ref: "#/components/schemas/BookVO"
        - type: object
          properties:
            keywords:
              type: array
              items:
                type: string
              example: ["Java", "JVM", "虚拟机", "性能优化"]
            relatedBooks:
              type: array
              items:
                $ref: "#/components/schemas/BookVO"
              description: 相关图书（知识图谱关联）
            reservationCount:
              type: integer
              description: 当前预约人数
              example: 2

    BookSearchRequest:
      type: object
      properties:
        keyword:
          type: string
          description: 搜索关键词
          example: "Java虚拟机"
        author:
          type: string
          description: 作者筛选
          example: "周志明"
        isbn:
          type: string
          description: ISBN 精确搜索
        categoryId:
          type: integer
          format: int64
          description: 分类筛选
        sortBy:
          type: string
          enum: [relevance, borrowCount, pubDate]
          default: relevance
        pageNum:
          type: integer
          default: 1
        pageSize:
          type: integer
          default: 20

    # ---- 借阅 ----
    BorrowRequest:
      type: object
      required: [bookId]
      properties:
        bookId:
          type: integer
          format: int64
          description: 图书 ID
          example: 42
    BorrowResultVO:
      type: object
      properties:
        borrowId:
          type: integer
          format: int64
          example: 520
        bookTitle:
          type: string
        dueDate:
          type: string
          format: date
          description: 应还日期
          example: "2026-07-15"
        status:
          type: string
          enum: [BORROWED]
    RenewResultVO:
      type: object
      properties:
        borrowId:
          type: integer
          format: int64
        oldDueDate:
          type: string
          format: date
        newDueDate:
          type: string
          format: date
          description: 续借后新的应还日期（延长30天）
          example: "2026-08-14"
        renewCount:
          type: integer

    BorrowRecordVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
          description: 用户 ID（管理员视图可跨用户查询）
        book:
          $ref: "#/components/schemas/BookSimpleVO"
        borrowDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        returnDate:
          type: string
          format: date
          nullable: true
        renewCount:
          type: integer
        status:
          type: string
          enum: [BORROWED, RENEWED, RETURNED, OVERDUE]
        fineAmount:
          type: number
          format: double
          nullable: true

    # ---- 预约 ----
    ReservationRequest:
      type: object
      required: [bookId]
      properties:
        bookId:
          type: integer
          format: int64
          example: 42
    ReservationVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
          description: 用户 ID
        book:
          $ref: "#/components/schemas/BookSimpleVO"
        reserveTime:
          type: string
          format: date-time
        notifyTime:
          type: string
          format: date-time
          nullable: true
          description: 通知时间（48h 确认窗口起始时间）
        queuePosition:
          type: integer
          description: 当前排队序号
          example: 3
        status:
          type: string
          enum: [WAITING, NOTIFIED, RESERVED, EXPIRED, COMPLETED, CANCELLED]
        expireTime:
          type: string
          format: date-time
          nullable: true

    # ---- 推荐 ----
    BookRecommendVO:
      type: object
      properties:
        book:
          $ref: "#/components/schemas/BookSimpleVO"
        score:
          type: number
          format: double
          description: 推荐分数（0-1）
          example: 0.87
        reason:
          type: string
          description: 推荐理由
          example: "借阅过《Java并发编程》的读者也借了此书"

    # ---- 知识图谱 ----
    KnowledgeGraphVO:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
    GraphNode:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        type:
          type: string
          enum: [BOOK, AUTHOR, SUBJECT, KEYWORD, PUBLICATION]
        properties:
          type: object
          description: 节点附加属性
    GraphEdge:
      type: object
      properties:
        sourceId:
          type: integer
          format: int64
        targetId:
          type: integer
          format: int64
        relation:
          type: string
          enum: [CITES, AUTHORED_BY, BELONGS_TO, HAS_KEYWORD, RELATED_TO, PUBLISHED_IN, CO_CITED]
        weight:
          type: number
          format: double
          description: 关系权重

    TraceGraph:
      type: object
      properties:
        sourceBook:
          $ref: "#/components/schemas/BookVO"
        paths:
          type: array
          items:
            type: object
            properties:
              nodes:
                type: array
                items:
                  $ref: "#/components/schemas/GraphNode"
              edges:
                type: array
                items:
                  $ref: "#/components/schemas/GraphEdge"
              depth:
                type: integer
              totalWeight:
                type: number
                format: double

    # ---- 智能采编 ----
    PurchasePredictionVO:
      type: object
      properties:
        subjectId:
          type: integer
          format: int64
        subjectName:
          type: string
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: "2026-07"
        predictedDemand:
          type: integer
          description: 预测需求量（册）
        confidence:
          type: number
          format: double
          description: 置信度（0-1）
          example: 0.85
        features:
          type: object
          properties:
            historyTrend:
              type: number
              format: double
              description: 历史趋势因子
            seasonFactor:
              type: number
              format: double
              description: 季节因子
            reservationHeat:
              type: integer
              description: 预约热度

    DuplicateCheckResult:
      type: object
      properties:
        isDuplicate:
          type: boolean
          example: true
        duplicates:
          type: array
          items:
            type: object
            properties:
              book:
                $ref: "#/components/schemas/BookVO"
              score:
                type: number
                format: double
                description: 相似度分数
                example: 0.95
              matchStrategy:
                type: string
                enum: [ISBN_EXACT, TITLE_FUZZY, AUTHOR_TITLE]
                description: 匹配策略

    GapAnalysisResult:
      type: object
      properties:
        subjectId:
          type: integer
          format: int64
        subjectName:
          type: string
        totalCoreBooks:
          type: integer
          description: 学科核心书目总数
        ownedBooks:
          type: integer
          description: 已馆藏数量
        coverage:
          type: number
          format: double
          description: 馆藏覆盖率
          example: 0.72
        gapBooks:
          type: array
          items:
            type: object
            properties:
              isbn:
                type: string
              title:
                type: string
              author:
                type: string
              priority:
                type: string
                enum: [CRITICAL, HIGH, MEDIUM, LOW]
                description: 采购优先级

    NegotiationSuggestion:
      type: object
      properties:
        resourceName:
          type: string
        supplierName:
          type: string
        priceRange:
          type: object
          properties:
            floorPrice:
              type: number
              format: double
            ceilingPrice:
              type: number
              format: double
            medianPrice:
              type: number
              format: double
            suggestedOffer:
              type: number
              format: double
        strategies:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              description:
                type: string
              priority:
                type: integer
                description: 优先级 0-100
        keyTerms:
          type: array
          items:
            type: string
          description: 谈判关键条款
        riskWarnings:
          type: array
          items:
            type: string
          description: 风险提示

    # ---- 分类 ----
    CategoryVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "计算机科学"
        parentId:
          type: integer
          format: int64
          nullable: true
          description: 父分类ID，顶级分类为 null
        sortOrder:
          type: integer
          example: 1
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryVO"
          description: 子分类列表（仅树形查询时返回）

    # ---- 系统管理 ----
    UserManageVO:
      type: object
      description: 用户管理视图（管理员使用，含敏感信息脱敏）
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        realName:
          type: string
        role:
          type: string
          enum: [STUDENT, TEACHER, LIBRARIAN, ACQUISITOR, ADMIN]
        email:
          type: string
        phone:
          type: string
        maxBooks:
          type: integer
        status:
          type: string
          enum: [ACTIVE, FROZEN, DISABLED]
        currentBorrows:
          type: integer
          description: 当前借阅数
        totalOverdue:
          type: integer
          description: 历史超期次数
        createTime:
          type: string
          format: date-time

    UserStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, FROZEN, DISABLED]
          description: 目标状态

    BookCreateRequest:
      type: object
      required: [isbn, title, author, totalCopies, categoryId]
      properties:
        isbn:
          type: string
          example: "978-7-111-58680-7"
        title:
          type: string
          example: "深入理解Java虚拟机"
        author:
          type: string
          example: "周志明"
        publisher:
          type: string
        pubDate:
          type: string
          format: date
        categoryId:
          type: integer
          format: int64
        totalCopies:
          type: integer
          minimum: 1
          example: 5
        description:
          type: string
        location:
          type: string
        keywords:
          type: string
          description: 关键词（逗号分隔）

    BookUpdateRequest:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        publisher:
          type: string
        pubDate:
          type: string
          format: date
        categoryId:
          type: integer
          format: int64
        totalCopies:
          type: integer
          minimum: 1
        description:
          type: string
        location:
          type: string
        keywords:
          type: string

    # ---- 通用 ----
    ErrorResponse:
      type: object
      description: 错误响应（与 Result 在错误场景等价：code/message/timestamp）
      properties:
        code:
          type: integer
          description: 错误码
          example: 1001
        message:
          type: string
          description: 错误描述
          example: "图书库存不足"
        timestamp:
          type: integer
          format: int64

  # ---- 请求头参数 ----
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: "Bearer {access_token}"
    PageNum:
      name: pageNum
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: 页码
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: 每页数量

  # ---- 可复用响应 ----
  responses:
    RateLimited:
      description: 请求过于频繁，触发限流
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: 当前时间窗口允许的请求总量
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: 当前时间窗口剩余请求数
        X-RateLimit-Reset:
          schema:
            type: integer
            format: int64
          description: 限流窗口重置时间（Unix 时间戳）
        Retry-After:
          schema:
            type: integer
          description: 建议等待秒数
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 429
            message: "请求过于频繁，请稍后重试"
            timestamp: 1718400000000

# ============================================================
#  路径定义
# ============================================================
paths:
  # ======================== 认证模块 ========================
  /api/v1/auth/login:
    post:
      tags: [认证]
      summary: 用户登录
      description: 使用学号/工号和密码登录，返回 JWT 令牌对
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              student:
                summary: 学生登录
                value:
                  username: "2024001001"
                  password: "Abc@123456"
              admin:
                summary: 管理员登录
                value:
                  username: "admin"
                  password: "Admin@123456"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginResponse"
              example:
                code: 200
                message: "登录成功"
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refreshToken: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
                  tokenType: "Bearer"
                  expiresIn: 7200
                  user:
                    id: 1
                    username: "2024001001"
                    realName: "张三"
                    role: "STUDENT"
                    email: "zhangsan@university.edu.cn"
