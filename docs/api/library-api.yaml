  # ======================== 借阅管理模块 ========================
  /api/v1/borrows:
    post:
      tags: [借阅管理]
      summary: 借书申请
      description: |
        发起借阅请求。系统校验：
        1. 图书库存充足
        2. 用户未超出最大借阅数
        3. 用户无超期未还记录
        4. 未重复借阅同一本书
      operationId: borrowBook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BorrowRequest"
      responses:
        "200":
          description: 借阅成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BorrowResultVO"
        "400":
          description: |
            | 错误码 | 说明 |
            |--------|------|
            | 1001 | 图书库存不足 |
            | 1002 | 借阅数量超限 |
            | 1003 | 账户已冻结 |
        "409":
          description: 已借阅该书，不可重复借阅
        "429":
          $ref: "#/components/responses/RateLimited"

    get:
      tags: [借阅管理]
      summary: 我的借阅列表
      description: 查询当前用户的借阅记录
      operationId: getMyBorrows
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [BORROWED, RENEWED, RETURNED, OVERDUE]
          description: 按状态筛选（不传则全部）
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 借阅记录列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageResult"

  /api/v1/borrows/{id}:
    get:
      tags: [借阅管理]
      summary: 借阅详情
      operationId: getBorrowDetail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 借阅详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BorrowRecordVO"
        "404":
          description: 借阅记录不存在

  /api/v1/borrows/{id}/return:
    put:
      tags: [借阅管理]
      summary: 归还图书
      description: 归还后自动触发预约通知（如有排队读者）
      operationId: returnBook
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 借阅记录 ID
      responses:
        "200":
          description: 归还成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        "409":
          description: 该书已归还，不可重复操作

  /api/v1/borrows/{id}/renew:
    put:
      tags: [借阅管理]
      summary: 续借图书
      description: |
        续借规则：
        - 每本书最多续借 1 次
        - 续借延长期限：30 天
        - 超期图书不可续借
        - 已被预约的图书不可续借
      operationId: renewBook
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 借阅记录 ID
      responses:
        "200":
          description: 续借成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RenewResultVO"
        "400":
          description: 续借条件不满足

  /api/v1/admin/borrows/overdue:
    get:
      tags: [借阅管理]
      summary: 超期未还记录
      description: |
        查询所有超期未还记录。

        **角色权限**：LIBRARIAN / ADMIN（详见系统架构设计文档 §2.3 权限矩阵）。
      operationId: getOverdueRecords
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 超期记录列表
        "403":
          description: 无管理员权限

  # ======================== 预约管理模块 ========================
  /api/v1/reservations:
    post:
      tags: [预约管理]
      summary: 预约图书
      description: |
        预约已全部借出的图书，进入等待队列。
        - 使用 Redis ZSET 维护排队顺序
        - 图书归还后自动通知队首读者
        - 通知后 48h 内未确认自动释放
      operationId: reserveBook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationRequest"
      responses:
        "200":
          description: 预约成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReservationVO"
        "400":
          description: 图书有库存，可直接借阅，无需预约
        "409":
          description: 已预约过该书，不可重复预约
        "429":
          $ref: "#/components/responses/RateLimited"

    get:
      tags: [预约管理]
      summary: 我的预约列表
      operationId: getMyReservations
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [WAITING, NOTIFIED, RESERVED, EXPIRED, COMPLETED, CANCELLED]
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 预约列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageResult"

  /api/v1/reservations/{id}:
