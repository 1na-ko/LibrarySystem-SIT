      summary: 个性化推荐
      description: |
        混合推荐策略：
        - 协同过滤（User-CF + Item-CF）权重 0.4
        - 基于内容推荐（TF-IDF 向量余弦相似度）权重 0.3
        - 知识图谱推荐（多跳邻居发现）权重 0.3
      operationId: getRecommendations
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: 推荐列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/BookRecommendVO"

  # ======================== 知识图谱模块 ========================
  /api/v1/kg/book/{id}/graph:
    get:
      tags: [知识图谱]
      summary: 图书知识图谱
      description: 获取以指定图书为中心的知识图谱（主题关联网络），含 1-2 跳邻居
      operationId: getBookGraph
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 图书 ID
        - name: depth
          in: query
          schema:
            type: integer
            default: 2
            minimum: 1
            maximum: 3
          description: 邻居跳数
      responses:
        "200":
          description: 知识图谱数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/KnowledgeGraphVO"
              example:
                code: 200
                message: "操作成功"
                data:
                  nodes:
                    - id: 1
                      label: "深入理解Java虚拟机"
                      type: "BOOK"
                    - id: 101
                      label: "周志明"
                      type: "AUTHOR"
                    - id: 201
                      label: "JVM"
                      type: "KEYWORD"
                    - id: 202
                      label: "性能优化"
                      type: "KEYWORD"
                    - id: 301
                      label: "计算机科学"
                      type: "SUBJECT"
                    - id: 2
                      label: "Java并发编程实战"
                      type: "BOOK"
                  edges:
                    - sourceId: 1
                      targetId: 101
                      relation: "AUTHORED_BY"
                      weight: 1.0
                    - sourceId: 1
                      targetId: 201
                      relation: "HAS_KEYWORD"
                      weight: 0.9
                    - sourceId: 1
                      targetId: 301
                      relation: "BELONGS_TO"
                      weight: 1.0
                    - sourceId: 1
                      targetId: 2
                      relation: "CO_CITED"
                      weight: 0.75
                timestamp: 1718400000000
        "404":
          description: 图书不存在或无关联图谱

  /api/v1/kg/book/{id}/trace:
    get:
      tags: [知识图谱]
      summary: 文献溯源
      description: 获取文献引用链（前向/后向/双向溯源），揭示知识演化脉络
      operationId: traceLiterature
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 图书 ID
        - name: direction
          in: query
          schema:
            type: string
            enum: [FORWARD, BACKWARD, BOTH]
            default: BOTH
          description: |
            - FORWARD：谁引用了本文（前向溯源）
            - BACKWARD：本文引用了谁（后向溯源）
            - BOTH：双向溯源
        - name: maxDepth
          in: query
          schema:
            type: integer
            default: 3
            minimum: 1
            maximum: 5
          description: 最大跳数
      responses:
        "200":
          description: 溯源路径图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TraceGraph"

  /api/v1/kg/subject/{name}:
    get:
      tags: [知识图谱]
      summary: 学科主题网络
      description: 获取指定学科领域的完整知识网络（关键词关联 + PageRank 中心度）
      operationId: getSubjectNetwork
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: 学科名称（支持 URL 编码中文）
          example: "计算机科学"
        - name: topK
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: 返回的关键词节点数
      responses:
        "200":
          description: 学科主题网络
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/KnowledgeGraphVO"

  /api/v1/kg/search:
    get:
      tags: [知识图谱]
      summary: 知识实体搜索
      description: 在图谱中搜索实体（图书、作者、关键词、学科）
      operationId: searchEntities
      security:
        - BearerAuth: []
      parameters:
        - name: entity
          in: query
          required: true
          schema:
            type: string
          description: 实体名称
          example: "机器学习"
        - name: type
          in: query
          schema:
            type: string
            enum: [BOOK, AUTHOR, SUBJECT, KEYWORD]
          description: 实体类型筛选
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            entityId:
                              type: integer
                              format: int64
                            entityName:
                              type: string
                            entityType:
                              type: string
                            pagerank:
                              type: number
                              format: double

  # ======================== 智能采编模块 ========================
  /api/v1/acquisition/predict:
    get:
      tags: [智能采编]
      summary: 采购需求预测
      description: |
        基于 ARIMA 时间序列 + 多元回归，预测未来月份的采购需求量。
        特征变量：历史借阅趋势、预约热度、复本率、季节因子、学科增长率

        **角色权限**：ACQUISITOR / ADMIN（详见系统架构设计文档 §2.3 权限矩阵）。
      operationId: predictDemand
      security:
        - BearerAuth: []
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 学科 ID
        - name: months
          in: query
          schema:
            type: integer
            default: 3
            minimum: 1
            maximum: 12
          description: 预测未来月份数
      responses:
        "200":
          description: 预测结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PurchasePredictionVO"
              example:
                code: 200
                message: "操作成功"
                data:
                  - subjectId: 1
                    subjectName: "计算机科学"
                    month: "2026-07"
                    predictedDemand: 85
                    confidence: 0.85
                    features:
                      historyTrend: 1.15
                      seasonFactor: 1.5
                      reservationHeat: 23
                  - subjectId: 1
                    subjectName: "计算机科学"
                    month: "2026-08"
                    predictedDemand: 72
                    confidence: 0.78
                    features:
                      historyTrend: 1.15
                      seasonFactor: 1.0
                      reservationHeat: 18
                timestamp: 1718400000000

  /api/v1/acquisition/duplicate-check:
    post:
      tags: [智能采编]
      summary: 采购查重
      description: |
        三重策略查重：
        1. ISBN 精确匹配（权重 1.0）
        2. 标题模糊匹配（ES More Like This，阈值 0.8）
        3. 作者+标题联合匹配（余弦相似度，阈值 0.7）

        **角色权限**：ACQUISITOR / ADMIN；LIBRARIAN 可执行以辅助编目决策（详见系统架构设计文档 §2.3 权限矩阵）。
      operationId: checkDuplicate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                isbn:
                  type: string
                title:
                  type: string
                author:
                  type: string
                publisher:
                  type: string
            examples:
              full:
                summary: 完整信息
                value:
                  isbn: "978-7-111-58680-7"
                  title: "深入理解Java虚拟机"
                  author: "周志明"
                  publisher: "机械工业出版社"
              partial:
                summary: 仅标题
                value:
                  title: "Python机器学习实战"
                  author: "李明"
      responses:
        "200":
          description: 查重结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DuplicateCheckResult"

  /api/v1/acquisition/gap-analysis:
    get:
      tags: [智能采编]
      summary: 馆藏缺口分析
      description: |
        基于学科核心书目清单（来自知识图谱高 PageRank 节点），识别馆藏缺失。

        **角色权限**：ACQUISITOR / ADMIN（详见系统架构设计文档 §2.3 权限矩阵）。
      operationId: analyzeGap
      security:
        - BearerAuth: []
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 学科 ID
      responses:
        "200":
          description: 缺口分析结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GapAnalysisResult"

  /api/v1/acquisition/negotiation:
    post:
      tags: [智能采编]
      summary: 创建谈判记录
      description: |
        记录电子资源采购谈判信息，系统自动生成谈判建议。

        **角色权限**：ACQUISITOR / ADMIN（详见系统架构设计文档 §2.3 权限矩阵）。
      operationId: createNegotiation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceName, supplierId, resourceCategory]
              properties:
                resourceName:
                  type: string
                  description: 电子资源名称
                  example: "IEEE Xplore Digital Library"
                supplierId:
                  type: integer
                  format: int64
                  description: 供应商 ID
                resourceCategory:
                  type: string
                  enum: [JOURNAL, DATABASE, EBOOK, CONFERENCE]
                  description: 资源类别
                expectedBudget:
                  type: number
                  format: double
                  description: 预算金额（元）
                userCount:
                  type: integer
                  description: 预计使用人数
      responses:
        "200":
          description: 谈判建议
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NegotiationSuggestion"

  /api/v1/acquisition/negotiation/{id}/suggestion:
    get:
      tags: [智能采编]
      summary: 获取谈判建议详情
      operationId: getNegotiationSuggestion
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 谈判记录 ID
      responses:
        "200":
          description: 谈判建议
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NegotiationSuggestion"

  # ======================== 系统管理模块 ========================
  /api/v1/admin/users:
    get:
      tags: [系统管理]
      summary: 用户列表
      description: 分页查询用户列表（管理员权限）
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [STUDENT, TEACHER, LIBRARIAN, ACQUISITOR, ADMIN]
          description: 按角色筛选
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, FROZEN, DISABLED]
          description: 按状态筛选
        - name: keyword
          in: query
          schema:
            type: string
          description: 搜索用户名/姓名
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageResult"
        "403":
          description: 无管理员权限

  /api/v1/admin/users/{id}/status:
    put:
      tags: [系统管理]
      summary: 变更用户状态
      description: 冻结/解冻/禁用用户账户（管理员权限）
      operationId: updateUserStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusUpdateRequest"
      responses:
        "200":
          description: 状态变更成功
        "403":
          description: 无管理员权限
        "404":
          description: 用户不存在

  /api/v1/admin/books:
    post:
      tags: [系统管理]
      summary: 新增图书
      description: 图书编目 — 新增图书记录（图书管理员权限）
      operationId: createBook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreateRequest"
      responses:
        "200":
          description: 新增成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BookVO"
        "409":
          description: ISBN 已存在
        "403":
          description: 无编目权限

  /api/v1/admin/books/{id}:
    put:
      tags: [系统管理]
      summary: 修改图书信息
      description: 图书编目 — 修改已有图书记录（图书管理员权限）
      operationId: updateBook
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdateRequest"
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BookVO"
        "404":
          description: 图书不存在
        "403":
          description: 无编目权限

    delete:
      tags: [系统管理]
      summary: 删除图书
      description: 下架图书（仅当无活跃借阅记录时可删除，图书管理员权限）
      operationId: deleteBook
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 删除成功
        "409":
          description: 存在活跃借阅记录，无法删除
        "403":
          description: 无编目权限

  # ======================== 健康检查 ========================
  /api/v1/health:
    get:
      tags: [系统]
      summary: 健康检查
      description: |
        服务健康检查（Spring Boot Actuator，公开访问，无需认证）。

        `components` 下各中间件的 `UP` 状态依赖对应 Spring Boot Starter 自动装配的
        `HealthIndicator`。随各业务模块引入对应 starter，mysql / redis / elasticsearch /
        neo4j / rabbitmq 将依次出现；在 starter 尚未就位前仅展示已装配的组件，属预期行为。
      operationId: healthCheck
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "UP"
                  components:
                    type: object
                    properties:
                      mysql:
                        type: string
                        example: "UP"
                      redis:
                        type: string
                        example: "UP"
                      elasticsearch:
                        type: string
                        example: "UP"
                      neo4j:
                        type: string
                        example: "UP"
                      rabbitmq:
                        type: string
                        example: "UP"
