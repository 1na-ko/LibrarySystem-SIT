  # ======================== 图书检索模块 ========================
  /api/v1/books/search:
    get:
      tags: [图书检索]
      summary: 关键词搜索图书
      description: |
        支持按书名、作者、关键词的全文搜索。
        - 默认按**相关度**排序（BM25 算法 + 借阅热度加权）
        - 高并发搜索使用 Redis 缓存热点词（TTL 30min）
        - 中文分词基于 IK Analyzer
      operationId: searchBooks
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: 搜索关键词
          example: "Java虚拟机"
        - name: author
          in: query
          schema:
            type: string
          description: 作者筛选（可选）
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
          description: 分类筛选（可选）
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [relevance, borrowCount, pubDate]
            default: relevance
          description: 排序方式
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageResult"
              example:
                code: 200
                message: "操作成功"
                data:
                  records:
                    - id: 42
                      isbn: "978-7-111-58680-7"
                      title: "深入理解Java虚拟机"
                      author: "周志明"
                      publisher: "机械工业出版社"
                      pubDate: "2019-12-01"
                      categoryName: "计算机科学"
                      availCopies: 3
                      totalCopies: 5
                      borrowCount: 127
                  total: 15
                  pageNum: 1
                  pageSize: 20
                  totalPages: 1
                timestamp: 1718400000000
        "400":
          description: 关键词为空或格式非法
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/books/search/advanced:
    get:
      tags: [图书检索]
      summary: 高级组合搜索
      description: 多字段组合精确/模糊搜索，支持布尔逻辑
      operationId: advancedSearch
      parameters:
        - name: title
          in: query
          schema:
            type: string
          description: 书名（模糊匹配）
        - name: author
          in: query
          schema:
            type: string
          description: 作者（精确匹配）
        - name: isbn
          in: query
          schema:
            type: string
          description: ISBN（精确匹配）
        - name: publisher
          in: query
          schema:
            type: string
          description: 出版社（模糊匹配）
        - name: pubYearFrom
          in: query
          schema:
            type: integer
          description: 出版年份起始
        - name: pubYearTo
          in: query
          schema:
            type: integer
          description: 出版年份截止
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
        - name: onlyAvailable
          in: query
          schema:
            type: boolean
            default: false
          description: 仅显示有库存的
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PageResult"

  /api/v1/books/suggest:
    get:
      tags: [图书检索]
      summary: 搜索自动补全
      description: 根据用户输入前缀，返回补全建议列表（基于 ES Completion Suggester）
      operationId: suggest
      parameters:
        - name: prefix
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: 输入前缀
          example: "深入"
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 20
      responses:
        "200":
          description: 补全建议
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                              example: "深入理解Java虚拟机"
                            type:
                              type: string
                              enum: [book, author, keyword]
              example:
                code: 200
                message: "操作成功"
                data:
                  - text: "深入理解Java虚拟机"
                    type: "book"
                  - text: "深入浅出Spring Boot"
                    type: "book"
                  - text: "深入理解计算机系统"
                    type: "book"
                timestamp: 1718400000000

  /api/v1/books/hot:
    get:
      tags: [图书检索]
